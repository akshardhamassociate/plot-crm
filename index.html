<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plot CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plot CRM">
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#111827; --muted:#6b7280; --faint:#9ca3af;
    --line:#e7e9ee; --brand:#4f46e5; --brand2:#6366f1; --accent:#4f46e5;
    --side1:#111827; --side2:#1f2937;
    --ok:#16a34a; --wa:#22c55e; --danger:#dc2626; --amber:#d97706;
    --sh:0 1px 2px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.06);
    --sh-lg:0 10px 34px rgba(17,24,39,.12);
    --r:14px; --side:272px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  svg{width:20px;height:20px;flex-shrink:0}

  /* ── responsive shell ── */
  .shell{display:flex;flex-direction:column;min-height:100dvh}

  /* SIDE (mobile = top header, desktop = left sidebar) */
  .side{background:linear-gradient(165deg,var(--side1),var(--side2));color:#fff;
    position:sticky;top:0;z-index:20;padding:14px 16px 16px;box-shadow:0 4px 20px rgba(17,24,39,.25)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;
    border:1px solid rgba(255,255,255,.25)}
  .brand-logo{height:42px;width:auto;max-width:150px;background:#fff;border-radius:10px;padding:5px 9px;flex-shrink:0}
  .brand h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .brand .sub{font-size:.75rem;opacity:.82;margin-top:1px}
  .iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;border-radius:10px;padding:8px;display:flex;cursor:pointer;transition:.12s}
  .iconbtn:active{transform:scale(.94)}

  .nav{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:4px;margin-top:14px}
  .nav-item{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;
    font-size:.88rem;color:rgba(255,255,255,.85);cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:6px;transition:.15s}
  .nav-item.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
  .nav-item .dot{background:var(--danger);color:#fff;font-size:.66rem;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

  .side-foot{margin-top:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:9px 8px;text-align:center;cursor:pointer;transition:background .15s}
  .stat:active{background:rgba(255,255,255,.24)}
  .stat .n{font-size:1.35rem;font-weight:800;line-height:1.1}
  .stat .t{font-size:.66rem;opacity:.85;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .side .side-add,.side .import-d,.side .export-d,.side .logout-d{display:none}
  .hdr-actions{margin-left:auto;display:flex;gap:8px}

  /* login screen */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(165deg,var(--side1),var(--side2))}
  .login-card{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);padding:30px 26px;width:100%;max-width:380px;text-align:center}
  .login-card .logo-lg{width:56px;height:56px;border-radius:15px;background:var(--brand);color:#fff;
    font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login-logo{width:230px;max-width:80%;height:auto;display:block;margin:0 auto 18px}
  .login-card h1{margin:0 0 2px;font-size:1.3rem;font-weight:800}
  .login-card>p{color:var(--muted);font-size:.86rem;margin:0 0 20px}
  .login-card .field{text-align:left}
  .lg-err{color:var(--danger);font-size:.8rem;min-height:18px;margin:2px 0 8px;text-align:left}

  /* MAIN */
  .main{flex:1;min-width:0}
  .main-inner{max-width:1120px;margin:0 auto;padding:16px 18px calc(100px + env(safe-area-inset-bottom))}
  .page-title{display:none}

  @media(min-width:1000px){
    body{font-size:15px}
    .shell{flex-direction:row}
    .side{width:var(--side);height:100dvh;padding:22px 16px;display:flex;flex-direction:column;
      overflow-y:auto;box-shadow:2px 0 24px rgba(18,50,91,.12)}
    .brand h1{font-size:1.25rem}
    .nav{flex-direction:column;background:none;padding:0;gap:4px;margin-top:22px}
    .nav-item{justify-content:flex-start;padding:12px 14px;border-radius:11px;font-size:.95rem}
    .nav-item.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.45)}
    .nav .nav-item svg{display:inline-block}   /* desktop sidebar shows icons */
    .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
    .stats{grid-template-columns:1fr 1fr}
    .side .hdr-actions{display:none}
    .side .side-add{display:flex;width:100%}
    .side .import-d,.side .export-d{display:flex}
    .side .logout-d{display:flex;width:100%}
    .main-inner{padding:26px 34px 60px}
    .page-title{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
    .page-sub{display:block;color:var(--muted);font-size:.9rem;margin-bottom:18px}
    .fab{display:none!important}
  }

  /* ── form controls ── */
  input,select,textarea,button{font-family:inherit;font-size:.92rem}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,99,235,.13)}
  ::placeholder{color:var(--faint)}
  label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.03em;display:block;margin:0 0 5px}
  .field{margin-bottom:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .execchecks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:7px;background:#f4f5f8;border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-size:.85rem;font-weight:600;cursor:pointer}
  .chk input{width:auto;margin:0;accent-color:var(--brand)}
  .chk:has(input:checked){background:#eef0fc;border-color:var(--brand);color:var(--brand)}

  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search-wrap input{padding-left:40px}

  .btn{border:none;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;
    background:var(--brand);color:#fff;transition:.15s;display:inline-flex;align-items:center;
    justify-content:center;gap:7px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
  .btn.light{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn.sm{padding:9px 13px;font-size:.83rem}
  .btn.wide{width:100%}
  .btn.call{background:var(--ok)} .btn.wa{background:var(--wa)}
  .btn.danger{background:#fff;color:var(--danger);border:1.5px solid #fca5a5}

  .row{display:flex;gap:9px;align-items:center}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .tiny{font-size:.74rem;color:var(--muted)}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}

  /* reminder banner */
  .rem{display:flex;align-items:center;gap:13px;background:linear-gradient(100deg,#fff7ed,#fff);
    border:1px solid #fed7aa;border-left:4px solid var(--amber);border-radius:var(--r);
    padding:13px 15px;margin-bottom:16px;cursor:pointer;box-shadow:var(--sh)}
  .rem:active{transform:scale(.995)}
  .rem-ic{width:40px;height:40px;border-radius:11px;background:#fef3c7;color:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rem b{font-size:.95rem} .rem .go{color:var(--amber);font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:3px}

  /* urgent reminders */
  .alert{display:flex;align-items:center;gap:12px;background:#fef2f2;border:1px solid #fecaca;
    border-left:4px solid var(--danger);border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .alert .a-ic{width:40px;height:40px;border-radius:11px;background:#fee2e2;color:var(--danger);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .alert b{color:var(--danger);font-size:.98rem}
  .lead.urgent{border-color:#fecaca;border-left:4px solid var(--danger);background:#fff7f7}
  .stat.stat-alert{background:rgba(220,38,38,.24);border-color:rgba(248,113,113,.55)}
  .stat.stat-alert .n{color:#fca5a5}
  .nav .nav-item svg{display:none}   /* mobile nav = text only, fits 4 tabs */

  /* leads list -> grid on desktop */
  .leads{display:flex;flex-direction:column;gap:9px}
  @media(min-width:1000px){ .leads{display:grid;grid-template-columns:1fr 1fr;gap:12px} }
  .lead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;transition:.12s}
  .lead:active{background:#f8fafc}
  @media(min-width:1000px){ .lead:hover{box-shadow:var(--sh-lg);transform:translateY(-1px)} }

  /* table (desktop list view) */
  .leads-table{display:none;width:100%;border-collapse:separate;border-spacing:0;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  @media(min-width:1000px){ .leads-cards{display:none} .leads-table{display:table} }
  .leads-table th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
  .leads-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.87rem}
  .leads-table tbody tr{cursor:pointer;transition:.1s}
  .leads-table tbody tr:hover{background:#f8fafc}
  .leads-table tbody tr:last-child td{border-bottom:none}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;display:inline-flex;cursor:pointer;color:var(--muted)}
  .tbtn svg{width:17px;height:17px}
  .tbtn.tcall{color:var(--ok)} .tbtn.twa{color:var(--wa)}
  .tbtn:active{transform:scale(.94)}

  /* pagination */
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .psize,.pnav{display:flex;align-items:center;gap:6px}
  .pbtn{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);background:#fff;
    border-radius:9px;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer}
  .pbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pbtn:disabled{opacity:.4;cursor:default}

  /* kanban board */
  .kfilters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .kfilters .search-wrap{flex:1;min-width:170px}
  .kfilters select{width:auto;min-width:140px}
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
  .kanban::-webkit-scrollbar{height:8px}
  .kanban::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .kcol{flex:0 0 270px;background:#eef1f5;border-radius:14px;padding:10px}
  .kcol.drop{outline:2px dashed var(--brand);outline-offset:-2px;background:#e6eafc}
  .kcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:4px 6px 12px}
  .kcol-h .cnt{margin-left:auto;background:#fff;color:var(--muted);font-size:.72rem;font-weight:800;
    padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
  .dotc{width:9px;height:9px;border-radius:50%;display:inline-block}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:var(--sh)}
  .kcard .kn{font-weight:700;font-size:.9rem;margin-bottom:2px}
  .kcard[draggable=true]{cursor:grab}
  .kcard.dragging{opacity:.4}
  .avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:1rem}
  .chev{color:var(--faint)}
  .badge{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap}
  .odot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;
    box-shadow:0 0 0 3px rgba(220,38,38,.15)}

  .scroll-x{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
  .scroll-x::-webkit-scrollbar{display:none}
  .chip{font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
    background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;
    background:var(--brand);color:#fff;border:none;border-radius:50px;padding:14px 24px;
    font-weight:800;font-size:.92rem;box-shadow:0 8px 24px rgba(79,70,229,.42);cursor:pointer;
    display:flex;align-items:center;gap:8px}
  .fab:active{transform:translateX(-50%) scale(.96)}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:40;display:flex;
    align-items:flex-end;justify-content:center;animation:fade .18s ease}
  .modal{background:#fff;width:100%;max-width:560px;max-height:93dvh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:8px 18px 28px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @media(min-width:1000px){ .modal-bg{align-items:center} .modal{border-radius:20px;max-height:88dvh} }
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(24px)}}
  .grab{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 14px}
  @media(min-width:1000px){ .grab{display:none} .modal{padding-top:20px} }
  .modal h2{margin:0 0 4px;font-size:1.08rem;font-weight:800}
  .modal .msub{font-size:.78rem;color:var(--muted);margin-bottom:16px}

  .detail-head{background:linear-gradient(135deg,var(--side1),var(--side2));color:#fff;
    padding:14px 18px;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px rgba(17,24,39,.25)}
  .detail-head h1{margin:0;font-size:1.1rem;font-weight:800}
  .detail-head .sub{font-size:.75rem;opacity:.82}
  @media(min-width:1000px){
    .detail-head{background:#fff;color:var(--ink);box-shadow:inset 0 -1px 0 var(--line);position:static;padding:0 0 18px}
    .detail-head .iconbtn{background:#f1f5f9;border-color:var(--line);color:var(--ink)}
  }
  .detail-inner{max-width:820px;margin:0 auto}
  .sec{font-size:.72rem;font-weight:800;color:var(--faint);text-transform:uppercase;
    letter-spacing:.05em;margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
  .kv{display:flex;gap:10px;font-size:.88rem;padding:8px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv b{color:var(--muted);font-weight:600;min-width:120px;font-size:.82rem}
  .fu-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px;background:#fff;box-shadow:var(--sh)}
  .fu-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .fu-line{font-size:.86rem;margin:4px 0}
  .fu-line b{color:var(--muted);font-weight:600}
  .att{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;color:#1e40af;
    font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:8px;margin:5px 5px 0 0}
  .arrow{color:var(--faint);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:52px 24px;font-size:.9rem}
  .empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:10px}
  .grp-label{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    margin:20px 2px 9px;display:flex;align-items:center;gap:7px}
  a.plain{text-decoration:none;color:inherit;display:block}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
// ── icons (inline SVG, currentColor) ─────────────────────────────────────────
const IC = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.8 12.8 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.8 12.8 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',

  add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',

async function uploadFile(inputId){                // uploads to Cloudinary, returns a playable URL
  const fl = document.getElementById(inputId).files[0];
  if(!fl) return '';
  try{
    const fd = new FormData();
    fd.append('file', fl);
    fd.append('upload_preset', CLOUDINARY.preset);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/auto/upload`, { method:'POST', body:fd });
    const data = await res.json();
    if(data.secure_url) return data.secure_url;
    // upload reject hua — reason dikhao (silent fallback ki jagah)
    alert('⚠ File upload nahi hui:\n'+((data.error&&data.error.message)||'unknown')+'\n\nFile: '+fl.name+'\n(Sirf naam save hoga. Recording ko mp3/m4a/wav me try karo.)');
    return fl.name;
  }catch(err){ alert('⚠ Upload network error: '+err.message+'\n(Sirf naam save hoga — net check karo.)'); return fl.name; }
}

// ── helpers ─────────────────────────────────────────────────────────────────
const lastFU = L => L.followUps && L.followUps.length ? L.followUps[0] : null;
const execsOf = L => (Array.isArray(L.execs)&&L.execs.length) ? L.execs : (L.exec ? [L.exec] : []);
const execStr = L => execsOf(L).join(', ') || '—';
function avatarColor(name){ let h=0; for(const c of name) h=c.charCodeAt(0)+((h<<5)-h);
  return `hsl(${Math.abs(h)%360},50%,42%)`; }
const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
function badge(k){ const s=stMap[k]||stMap.fresh;
  return `<span class="badge" style="background:${s.bg};color:${s.c}">${s.l}</span>`; }
const dueDate = L => { const fu=lastFU(L); return (fu && OPEN.includes(L.status)) ? fu.nextDate : ''; };
const isDue = L => { const d=dueDate(L); return d && d<=today(); };
const isOverdue = L => { const d=dueDate(L); return d && d<today(); };
const isNew = L => OPEN.includes(L.status) && !(L.followUps && L.followUps.length);   // assigned, abhi tak koi kaam nahi
const needsAction = L => isNew(L) || isDue(L);                                        // pending = naya ya due
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function filtered(){
  return leads.filter(L=>{
    if(f.status && L.status!==f.status) return false;
    if(f.colony && L.colony!==f.colony) return false;
    if(f.exec && !execsOf(L).includes(f.exec)) return false;
    if(f.q){ const q=f.q.toLowerCase();
      if(!(L.name.toLowerCase().includes(q)||L.mobile.includes(f.q)||(L.plot||'').toLowerCase().includes(q))) return false; }
    const d = (lastFU(L)?.date)||L.createdAt||'';
    if(f.from && d < f.from) return false;
    if(f.to && d > f.to) return false;
    return true;
  }).sort((a,b)=>((lastFU(b)?.date)||b.createdAt||'').localeCompare((lastFU(a)?.date)||a.createdAt||''));
}

function pageSlice(arr){
  const pages=Math.max(1,Math.ceil(arr.length/pageSize));
  if(page>pages) page=pages; if(page<1) page=1;
  return arr.slice((page-1)*pageSize, page*pageSize);
}

// ── IMPORT (bulk add from CSV) ───────────────────────────────────────────────
function importCSV(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>parseImport(String(r.result)); r.readAsText(file); };
  inp.click();
}
function parseCSV(text){                         // handles quoted fields, commas, newlines
  const rows=[]; let field='',row=[],inQ=false; text=text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseImport(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==''));
  if(rows.length<2){ alert('CSV is empty or has no data rows.'); return; }
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ci={ name:col('name','contact'), mobile:col('mobile','phone','mobile number'),
    occupation:col('occupation','business'), city:col('city','city / address','address'),
    colony:col('colony','colony / plot'), plot:col('plot','preferred plot'),
    source:col('source','lead source'), agent:col('agent','agent name'),
    exec:col('executive','exec'), status:col('status') };
  if(ci.name<0||ci.mobile<0){ alert('CSV needs at least "Name" and "Mobile" columns.\nTip: use an Export file as your template.'); return; }
  const stByLabel=Object.fromEntries(STATUSES.map(s=>[s.l.toLowerCase(),s.k]));
  const seen=new Set(leads.map(L=>digits(L.mobile)));   // dedupe by mobile
  const batch=db.batch();                               // ponytail: single batch (Firestore limit 500 rows/import)
  let added=0, skipped=0;
  rows.slice(1).forEach(r=>{
    const g=i=>i>=0?(r[i]||'').trim():'';
    const name=g(ci.name), mob=g(ci.mobile);
    if(!name||!mob){ skipped++; return; }
    if(seen.has(digits(mob))){ skipped++; return; }
    seen.add(digits(mob));
    const L={ id:uid(), name, mobile:mob, occupation:g(ci.occupation), city:g(ci.city),
      colony:g(ci.colony), plot:g(ci.plot), source:g(ci.source)||'Other', agent:g(ci.agent),
      exec:g(ci.exec), status:stByLabel[g(ci.status).toLowerCase()]||'fresh',
      createdAt:today(), need:{}, followUps:[] };
    leads.unshift(L); batch.set(col().doc(L.id), L); added++;
  });
  batch.commit().catch(e=>alert('Import save failed: '+e.message));
  page=1; render();
  alert(`Import complete — ${added} added, ${skipped} skipped (missing name/mobile or duplicate).`);
}

    <button class="btn wide" onclick="doLogin()">Sign in</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="doReset()">Forgot password?</button>
  </div></div>`;
}
function lgErr(m){ const e=document.getElementById('lg_err'); if(e) e.textContent=m; }
function doLogin(){
  const e=val('lg_email'), p=document.getElementById('lg_pass').value;
  if(!e||!p){ lgErr('Enter email and password'); return; }
  auth.signInWithEmailAndPassword(e,p).catch(err=>lgErr(err.message.replace('Firebase: ','')));
}
function doReset(){
  const e=val('lg_email');
  if(!e){ lgErr('Enter your email first, then tap Forgot password'); return; }
  auth.sendPasswordResetEmail(e).then(()=>lgErr('Reset link sent to '+e)).catch(err=>lgErr(err.message.replace('Firebase: ','')));
}
function doLogout(){ auth.signOut(); }

// ── push notifications (reminders) ───────────────────────────────────────────
// native app (Capacitor) ho to native FCM, warna web push
const isNative = ()=>{ try{ return !!(window.Capacitor && (Capacitor.isNativePlatform ? Capacitor.isNativePlatform() : (Capacitor.getPlatform && Capacitor.getPlatform()!=='web'))); }catch(_){ return false; } };
const pnPlugin = ()=> window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
async function regNative(name){
  const PushNotifications = pnPlugin();
  if(!PushNotifications){ alert('Push plugin nahi mila — naya (push wala) APK install karo.'); return; }
  try{
    const perm = await PushNotifications.requestPermissions();
    if(perm.receive!=='granted'){ alert('Notification allow nahi hui. Phone settings me app ke notifications ON karo.'); return; }
    if(!window._pnSetup){
      window._pnSetup = true;
      PushNotifications.addListener('registration', t=>{
        const nm = localStorage.getItem('myName')||'';
        db.collection('tokens').doc(t.value).set({ token:t.value, name:nm, nameKey:nm.toLowerCase(), email:user?user.email:'', platform:'android', ts:Date.now() });
      });
      PushNotifications.addListener('registrationError', e=>alert('Push error: '+JSON.stringify(e)));
      PushNotifications.addListener('pushNotificationReceived', ()=>updateBadge());
    }
    await PushNotifications.register();
    alert('Reminder notifications ON ✅ ('+name+')\nAb reliable notification aayega!');
  }catch(e){ alert('Native push error: '+e.message); }
}
function enableNotifs(){
  if(!isNative() && !pnPlugin() && !messaging){ alert('Is browser/phone me notifications support nahi. (iPhone pe: app install karke, iOS 16.4+ chahiye.)'); return; }
  const cur = localStorage.getItem('myName')||'';
  modal(`
    <h2>Reminder notifications ON</h2>
    <div class="msub">Apna naam chuno — isi se aapke due follow-up ka notification aayega</div>
    <div class="field"><label>Aapka naam</label>${execSelect('notif_name', cur)}</div>
    <div class="row" style="gap:11px">
      <button class="btn ghost grow" onclick="this.closest('.modal-bg').remove()">Cancel</button>
      <button class="btn grow" onclick="confirmNotif()">Enable</button>
    </div>`);
}
async function confirmNotif(){
  const name = val('notif_name');
  if(!name){ alert('Pehle apna naam chuno'); return; }
  localStorage.setItem('myName', name);
  const m=document.querySelector('.modal-bg'); if(m) m.remove();
  if(isNative() || pnPlugin()){ return regNative(name); }   // native app → native FCM
  if(typeof Notification === 'undefined'){ alert('Yahan notifications support nahi. App me 🔔 dabao, ya browser (Chrome) me kholo.'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ alert('Notification allow nahi hui. Phone settings me is site ke notifications ON karo.'); return; }
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
    if(!token){ alert('Token nahi mila — dobara try karo.'); return; }
    await db.collection('tokens').doc(token).set({
      token, name, nameKey: name.toLowerCase(),
      email: user ? user.email : '', ts: Date.now()
    });
    alert('Reminder notifications ON ✅\nAb roz subah aapke due follow-ups ka notification aayega, '+name+'!');
  }catch(e){ alert('Error: '+e.message); }
}

// ── boot ─────────────────────────────────────────────────────────────────────
let _t;
function debouncedRender(){ clearTimeout(_t); _t=setTimeout(render,180); }
// app-icon badge = mere pending leads (naye + due). Assign hote hi count me aa jaata hai.
function updateBadge(){
  try{
    if(!('setAppBadge' in navigator)) return;
    const mine=(localStorage.getItem('myName')||'').toLowerCase();
    const rel = mine ? leads.filter(L=>execsOf(L).some(e=>(e||'').toLowerCase()===mine)) : leads;
    const n = rel.filter(needsAction).length;
    if(n>0) navigator.setAppBadge(n); else navigator.clearAppBadge();
  }catch(_){}
}
// foreground notification — app khula ho tab bhi notification dikhe (aur ye test bhi karega ki FCM device tak aa raha hai)
try{
  if(messaging) messaging.onMessage(async p=>{
    const n=p.notification||{};
    try{ const reg=swReg||await navigator.serviceWorker.ready; await reg.showNotification(n.title||'Plot CRM',{body:n.body||'',icon:'icon.svg'}); }
    catch(_){ alert('🔔 '+(n.title||'Notification')+'\n'+(n.body||'')); }
    updateBadge();
  });
}catch(_){}
function render(){
  if(!user){ renderLogin(); return; }
  const content = route.view==='detail' ? detailHTML() :
                  route.view==='kanban' ? kanbanHTML() :
                  route.view==='reminders' ? remindersHTML() :
                  route.view==='today' ? todayHTML() : listHTML();
  document.getElementById('app').innerHTML = `<div class="shell">${sideHTML()}<main class="main">${content}</main></div>`;
}
document.getElementById('app').innerHTML = '<div class="login"><div class="login-card">Loading…</div></div>';
auth.onAuthStateChanged(u=>{
  user=u;
  if(u){
    if(!unsub){
      unsub = col().onSnapshot(snap=>{
        leads = snap.docs.map(d=>{ const L={id:d.id, ...d.data()};
          if(!Array.isArray(L.followUps)) L.followUps=[]; if(!L.need) L.need={}; return L; });
        render(); updateBadge();
      }, err=>{ alert('Data load error: '+err.message); });
    }
  } else {
    if(unsub){ unsub(); unsub=null; }
    leads=[]; renderLogin();
  }
});

// PWA — register service worker (offline + installable)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{}));
}
</script>
