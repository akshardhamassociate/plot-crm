name: Daily follow-up reminders

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install firebase-admin
      - run: node send-reminders.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
